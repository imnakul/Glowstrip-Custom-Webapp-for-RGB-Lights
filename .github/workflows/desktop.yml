name: Desktop app

# Builds the Windows installer and publishes it as a GitHub Release.
#
# Runs automatically on every push to main that touches the app. It only
# publishes when the version in desktop/src-tauri/tauri.conf.json has no
# release yet, so bumping that version is what ships a new desktop build.
# Can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - icons/**
      - desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "desktop-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release desktop-v$version already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install --no-fund --no-audit

      - name: Build and publish installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: Glowstrip Desktop v__VERSION__
          releaseBody: |
            Windows installer for Glowstrip ${{ needs.check.outputs.version }}.

            Download `Glowstrip_${{ needs.check.outputs.version }}_x64-setup.exe` below and run it.
            Windows SmartScreen may warn about an unknown publisher because the app isn't code-signed: choose **More info → Run anyway**.

            The web app (PWA) is always at https://glowstrip.vercel.app
          releaseDraft: false
          prerelease: false
